[package]
name = "rune"
version = "0.1.0"
description = "Zero-latency desktop file search engine for Linux"
authors = ["Rune"]
edition = "2021"

[lib]
name = "lumina_search_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
